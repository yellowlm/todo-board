<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办看板</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-cycle" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></symbol>
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></symbol>
</svg>

<div class="window">
  <div class="titlebar" id="titlebar">
    <div class="app"><img src="icon.png" alt="">待办看板</div>
    <div class="spacer"></div>
    <button class="winbtn" id="btnSections" title="分区管理"><svg class="i sm"><use href="#i-layers"/></svg></button>
    <button class="winbtn" id="btnSettings" title="设置"><svg class="i sm"><use href="#i-settings"/></svg></button>
    <button class="winbtn" id="btnMin" title="最小化到托盘"><svg class="i sm"><use href="#i-min"/></svg></button>
    <button class="winbtn close" id="btnClose" title="关闭到托盘"><svg class="i sm"><use href="#i-close"/></svg></button>
  </div>

  <div id="boardView" class="list"></div>

  <div id="detailView" class="detailview" hidden>
    <div class="detail-head">
      <div class="grow">
        <h2 id="detailTitle"></h2>
        <div class="sub" id="detailSub"></div>
      </div>
      <button class="btn" id="detailEdit">✏️ 编辑描述</button>
    </div>
    <div class="md" id="detailBody"></div>
    <div class="foot">
      <button class="btn" id="detailBack">↩️ 返回列表</button>
      <button class="btn btn-primary" id="detailToggle">✅ 标记完成</button>
    </div>
  </div>

  <div id="sectionsView" class="detailview" hidden>
    <div class="toolbar">
      <button class="btn btn-primary" id="btnNewSection">➕ 新建分区</button>
      <div class="grow"></div>
      <span class="count" id="sectionsCount"></span>
    </div>
    <div class="list" id="sectionsList"></div>
  </div>

  <div id="settingsView" class="detailview" hidden>
    <div class="toolbar">
      <span class="section-name">设置</span>
      <div class="grow"></div>
    </div>
    <div class="list" id="settingsList"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
